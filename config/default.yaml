# Default training configuration
data_dir: "./data/processed"
checkpoint_dir: "./checkpoints"

model:
  champion_dim: 64
  draft_dim: 256
  patch_dim: 16
  team_hidden: 512
  num_team_layers: 3
  dropout: 0.1

training:
  batch_size: 512
  learning_rate: 3e-4
  weight_decay: 0.01
  max_epochs: 100
  patience: 10
  warmup_steps: 1000
  num_workers: 4
  device: "cuda"

# For local development, you can override with:
# python train.py --config config/default.yaml --data-dir ./data/processed