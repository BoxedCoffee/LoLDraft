data_dir: "./data/processed"
device: "cuda"
checkpoint_dir: "./checkpoints"

model:
  champion_dim: 64
  draft_dim: 256
  patch_dim: 16
  team_hidden: 512
  num_team_layers: 3
  dropout: 0.1

training:
  batch_size: 256
  learning_rate: 3.0e-4
  weight_decay: 0.01
  max_epochs: 50
  patience: 8
  warmup_steps: 500
  num_workers: 0
