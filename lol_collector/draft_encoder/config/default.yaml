# Draft Encoder — Default Training Configuration

data_dir: "./data/processed"
device: "cuda"  # "cuda" or "cpu"
checkpoint_dir: "./checkpoints"
seed: 42
deterministic: false

model:
  champion_dim: 64
  draft_dim: 256
  patch_dim: 16
  team_hidden: 512
  num_team_layers: 3
  dropout: 0.1

training:
  batch_size: 512
  learning_rate: 3.0e-4
  weight_decay: 0.01
  max_epochs: 100
  patience: 10
  warmup_steps: 1000
  num_workers: 0
  checkpoint_metric: "win_logloss"
  checkpoint_interval: 1
  checkpoint_backup_keep: 5
