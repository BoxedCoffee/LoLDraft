<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends Draft Encoder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>League of Legends Draft Encoder</h1>
        <p>Enter two teams to predict win probability, gold curve, and objectives</p>

        <div class="team-inputs">
            <div class="blue-team">
                <h2>Blue Team</h2>
                <div class="champion-inputs" id="blue-champions">
                    <!-- Champions will be added here dynamically -->
                </div>
            </div>

            <div class="red-team">
                <h2>Red Team</h2>
                <div class="champion-inputs" id="red-champions">
                    <!-- Champions will be added here dynamically -->
                </div>
            </div>
        </div>

        <button id="predict-btn">Make Prediction</button>

        <div id="results" class="results">
            <!-- Results will appear here -->
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
